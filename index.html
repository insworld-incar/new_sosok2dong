<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>소속이동신청서 자동화</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16233F;
    --ink-soft:#3B4A6B;
    --bg:#F5F6F8;
    --panel:#FFFFFF;
    --border:#DCE1EA;
    --border-strong:#B9C2D4;
    --teal:#0F6E66;
    --teal-soft:#E4F2F0;
    --amber:#B45309;
    --amber-soft:#FDF1E2;
    --red:#B91C1C;
    --red-soft:#FCEAEA;
    --text:#1B2333;
    --text-mute:#6B7488;
    --mono: 'IBM Plex Mono', 'SF Mono', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{padding:28px 20px 80px;}
  .wrap{max-width:1180px;margin:0 auto;}

  /* header */
  .app-header{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid var(--border-strong);}
  .app-title{display:flex;align-items:center;gap:12px;}
  .app-title .mark{width:38px;height:38px;border-radius:9px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:-0.5px;}
  .app-title h1{font-size:19px;margin:0;font-weight:700;color:var(--ink);letter-spacing:-0.2px;}
  .app-title p{margin:2px 0 0;font-size:12.5px;color:var(--text-mute);}
  .badge-count{font-family:var(--mono);font-size:11px;background:var(--teal-soft);color:var(--teal);padding:4px 9px;border-radius:100px;font-weight:600;white-space:nowrap;}

  /* stepper */
  .stepper{display:flex;gap:0;margin-bottom:26px;}
  .step-pill{flex:1;display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:2px solid var(--border);position:relative;}
  .step-pill .num{font-family:var(--mono);font-size:11px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--border);color:var(--text-mute);font-weight:600;flex-shrink:0;}
  .step-pill .label{font-size:12.5px;color:var(--text-mute);font-weight:600;}
  .step-pill.active{border-bottom-color:var(--ink);}
  .step-pill.active .num{background:var(--ink);color:#fff;}
  .step-pill.active .label{color:var(--ink);}
  .step-pill.done .num{background:var(--teal);color:#fff;}
  .step-pill.done .label{color:var(--teal);}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:26px;margin-bottom:18px;}
  .panel h2{font-size:15px;margin:0 0 4px;color:var(--ink);}
  .panel .sub{font-size:12.5px;color:var(--text-mute);margin:0 0 18px;}

  .upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:760px){.upload-grid{grid-template-columns:1fr;}}
  .dropzone{border:1.5px dashed var(--border-strong);border-radius:10px;padding:22px 16px;text-align:center;cursor:pointer;transition:border-color .15s, background .15s;background:#FBFCFD;}
  .dropzone:hover{border-color:var(--teal);background:var(--teal-soft);}
  .dropzone.filled{border-style:solid;border-color:var(--teal);background:var(--teal-soft);}
  .dropzone .dz-title{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:4px;}
  .dropzone .dz-desc{font-size:11.5px;color:var(--text-mute);margin-bottom:10px;line-height:1.5;}
  .dropzone .dz-menupath{font-size:10.5px;color:var(--teal);background:var(--teal-soft);display:inline-block;padding:3px 9px;border-radius:5px;font-family:var(--mono);margin-bottom:10px;}
  .dropzone .dz-file{font-family:var(--mono);font-size:11.5px;color:var(--teal);word-break:break-all;}
  .dropzone input{display:none;}
  .dz-icon{width:30px;height:30px;margin:0 auto 8px;color:var(--text-mute);}
  .dropzone.filled .dz-icon{color:var(--teal);}

  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:12px;font-weight:600;color:var(--ink-soft);}
  .field input[type=text]{border:1px solid var(--border-strong);border-radius:7px;padding:9px 11px;font-size:13px;font-family:var(--sans);color:var(--text);}
  .field input[type=text]:focus{outline:2px solid var(--teal);outline-offset:0;border-color:var(--teal);}
  .field .hint{font-size:11px;color:var(--text-mute);}

  .btn{appearance:none;border:none;border-radius:8px;padding:11px 20px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:transform .05s, opacity .15s;}
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover:not(:disabled){background:#22335A;}
  .btn-teal{background:var(--teal);color:#fff;}
  .btn-teal:hover:not(:disabled){background:#0C5A53;}
  .btn-ghost{background:transparent;color:var(--ink-soft);border:1px solid var(--border-strong);}
  .btn-ghost:hover:not(:disabled){background:#F1F3F6;}
  .btn-row{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;}

  .error-box{background:var(--red-soft);color:var(--red);border:1px solid #F3C7C7;padding:12px 14px;border-radius:8px;font-size:12.5px;margin-top:14px;line-height:1.6;}
  .error-box b{display:block;margin-bottom:2px;}

  /* loading */
  .loading-panel{text-align:center;padding:60px 20px;}
  .spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--ink);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 18px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-panel p{font-size:13px;color:var(--text-mute);}

  /* summary bar */
  .summary-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px;}
  .sumcard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
  .sumcard .n{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--ink);}
  .sumcard .l{font-size:11.5px;color:var(--text-mute);margin-top:2px;}
  .sumcard.warn .n{color:var(--amber);}

  /* employee cards */
  .emp-card{border:1px solid var(--border);border-radius:11px;margin-bottom:14px;overflow:hidden;background:var(--panel);}
  .emp-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#FAFBFC;border-bottom:1px solid var(--border);cursor:pointer;gap:14px;}
  .emp-head .who{display:flex;align-items:center;gap:12px;}
  .emp-head .name{font-size:14.5px;font-weight:700;color:var(--ink);}
  .emp-head .meta{font-size:11.5px;color:var(--text-mute);font-family:var(--mono);}
  .emp-head .org-path{font-size:11.5px;color:var(--text-mute);max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .emp-head .chev{color:var(--text-mute);transition:transform .15s;font-size:11px;}
  .emp-head.open .chev{transform:rotate(90deg);}
  .emp-stat-pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .phone-quick{border:1px solid var(--border-strong);border-radius:6px;padding:5px 9px;font-size:11.5px;font-family:var(--mono);width:150px;background:#fff;}
  .phone-quick.empty{border-color:var(--amber);background:var(--amber-soft);}
  .phone-quick:focus{outline:2px solid var(--teal);outline-offset:0;border-color:var(--teal);}
  .pill{font-family:var(--mono);font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:5px;white-space:nowrap;}
  .pill.ok{background:var(--teal-soft);color:var(--teal);}
  .pill.warn{background:var(--amber-soft);color:var(--amber);}
  .pill.off{background:#F0F1F4;color:#9099AB;}

  .emp-body{display:none;padding:16px 18px 18px;}
  .emp-body.show{display:block;}
  .contact-field{display:flex;align-items:center;gap:10px;margin-bottom:16px;background:#FAFBFC;border:1px solid var(--border);border-radius:8px;padding:10px 14px;}
  .contact-field label{font-size:12px;font-weight:600;color:var(--ink-soft);white-space:nowrap;}
  .contact-field input{border:1px solid var(--border-strong);border-radius:6px;padding:7px 10px;font-size:13px;font-family:var(--mono);flex:1;max-width:220px;}
  .contact-field .req{color:var(--red);font-size:11px;font-weight:700;}

  table.co-table{width:100%;border-collapse:collapse;font-size:12px;}
  table.co-table th{text-align:left;font-size:10.5px;color:var(--text-mute);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border-strong);text-transform:uppercase;letter-spacing:.3px;}
  table.co-table td{padding:8px;border-bottom:1px solid var(--border);vertical-align:top;}
  table.co-table tr:last-child td{border-bottom:none;}
  .co-name{font-weight:700;color:var(--ink);font-size:12.5px;}
  .co-code{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);}
  .co-path{font-family:var(--mono);font-size:10.5px;color:var(--text-mute);line-height:1.7;}
  .co-path .node{padding:1px 5px;border-radius:4px;}
  .co-path .node.hit{background:var(--teal-soft);color:var(--teal);font-weight:700;}
  .co-path .node.miss{color:#B7BECC;text-decoration:line-through;}
  .co-path .arrow{color:#C7CDD9;margin:0 2px;}
  .chk{transform:scale(1.1);cursor:pointer;accent-color:var(--teal);}
  .manual-note{font-size:11px;color:var(--amber);background:var(--amber-soft);padding:2px 7px;border-radius:5px;display:inline-block;}

  .section-title{font-size:13px;font-weight:700;color:var(--ink);margin:26px 0 10px;display:flex;align-items:center;gap:8px;}
  .section-title .n{font-family:var(--mono);background:var(--border);color:var(--ink-soft);font-size:10.5px;padding:2px 7px;border-radius:5px;}

  .excluded-list{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:6px 4px;}
  .excluded-row{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;font-size:12px;border-bottom:1px solid var(--border);}
  .excluded-row:last-child{border-bottom:none;}
  .excluded-row .nm{font-weight:600;color:var(--ink);}
  .excluded-row .rs{color:var(--text-mute);font-size:11.5px;}

  .sticky-footer{position:sticky;bottom:16px;display:flex;justify-content:flex-end;gap:10px;margin-top:24px;padding:16px 18px;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(20,30,55,.08);}

  .manual-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:8px;}
  @media (max-width:900px){.manual-cards{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:520px){.manual-cards{grid-template-columns:1fr;}}
  .manual-card{border:1px solid var(--border);border-radius:10px;padding:14px;background:#FAFBFC;}
  .manual-card .co{font-weight:700;font-size:13px;color:var(--ink);margin-bottom:4px;}
  .manual-card .method{font-family:var(--mono);font-size:10.5px;color:var(--teal);background:var(--teal-soft);display:inline-block;padding:2px 7px;border-radius:5px;margin-bottom:8px;}
  .manual-card .note{font-size:11.5px;color:var(--text-mute);line-height:1.6;}

  /* off-screen render surface for PDF */
  #pdf-surface{position:fixed;left:-99999px;top:0;width:1123px;background:#fff;}
  .pdf-page{width:1123px;min-height:794px;padding:40px 55px;background:#fff;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#000;box-sizing:border-box;}
  .pdf-page .pf-note{font-size:12px;font-weight:700;margin-bottom:16px;}
  .pdf-page .pf-meta{font-size:12px;line-height:1.85;margin-bottom:8px;}
  .pdf-page .pf-title{font-size:21px;font-weight:700;margin:20px 0 16px;text-align:center;}
  .pdf-page .pf-title .co{margin-right:26px;}
  table.pf-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;}
  table.pf-table th{background:#fff;color:#000;font-weight:700;padding:9px 4px;font-size:12px;text-align:center;border:1px solid #000;}
  table.pf-table td{padding:9px 6px;border:1px solid #000;text-align:center;font-size:11.5px;height:24px;}
  table.pf-table td.left{text-align:left;padding-left:8px;}
  .pf-sign{margin-top:24px;text-align:right;font-size:13px;padding-right:6%;}
  .pf-footer{margin-top:16px;font-size:9px;color:#999;text-align:right;}

  .footer-credit{text-align:center;font-size:11px;color:var(--text-mute);margin-top:36px;}
</style>
</head>

/* ============ 유틸 ============ */

function cleanBranchCode(raw){
  if (raw === null || raw === undefined) return '';
  let s = String(raw).trim();
  if (s.startsWith('`')) s = s.slice(1).trim();
  return s;
}

function formatPersonalCode(raw){
  if (raw === null || raw === undefined) return '';
  if (typeof raw === 'number'){
    if (Number.isInteger(raw)) return String(raw);
    return String(raw);
  }
  return String(raw).trim();
}

function hasHangul(str){
  return /[가-힣]/.test(str || '');
}

function isUsableCode(str){
  if (!str) return false;
  const s = str.trim();
  if (s === '') return false;
  if (hasHangul(s)) return false; // "(위촉제한)" 등 특이사항 텍스트
  return true;
}

function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function readFileAsArrayBuffer(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsArrayBuffer(file);
  });
}
function readFileAsText(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = reject;
    r.readAsText(file, 'utf-8');
  });
}

async function parseXlsxToRows(file){
  const buf = await readFileAsArrayBuffer(file);
  const wb = XLSX.read(buf, {type:'array'});
  const sheetName = wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  return XLSX.utils.sheet_to_json(ws, {defval:''});
}

async function parseCsvToRows(file){
  let text = await readFileAsText(file);
  // strip BOM
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const wb = XLSX.read(text, {type:'string'});
  const sheetName = wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  return XLSX.utils.sheet_to_json(ws, {defval:''});
}

/* ============ 핵심 매칭 로직 ============ */

const ORG_SUFFIXES = ['지점','본부','사업단','총괄','대리점','지사','팀'];

function normalizeOrgName(name){
  let s = String(name ?? '').trim();
  if (s.endsWith('.')) s = s.slice(0,-1).trim();
  for (const suf of ORG_SUFFIXES){
    if (s.endsWith(suf) && s.length > suf.length){
      return s.slice(0, -suf.length).trim();
    }
  }
  return s;
}

function cleanBranchName(raw){
  let s = String(raw ?? '').trim();
  s = s.replace(/인카금융서비스\s*(\(주\)|㈜)?/g, '');
  s = s.replace(/\s+/g, ' ').trim();
  return s;
}

function buildOrgLookup(csvRows){
  // 정확 일치용: Map<부서명, Map<보험사, {code, name} | {ambiguous:true, codes:[...]}>>
  const exact = new Map();
  // 정규화(끝단어 제거) 일치용: Map<정규화명, Map<원래부서명, Map<보험사,{code,name}|{ambiguous}>>>
  const normGroups = new Map();

  function setOrFlagAmbiguous(map, company, entry){
    if (!map.has(company)){
      map.set(company, entry);
      return;
    }
    const existing = map.get(company);
    if (existing.ambiguous){
      if (!existing.codes.includes(entry.code)) existing.codes.push(entry.code);
      return;
    }
    if (existing.code !== entry.code){
      // 같은 부서명+보험사인데 코드가 서로 다른 행이 CSV에 중복 존재 -> 신뢰할 수 없으므로 애매함으로 표시
      map.set(company, { ambiguous:true, codes:[existing.code, entry.code] });
    }
    // 코드가 완전히 같은 단순 중복행이면 무시(그대로 유지)
  }

  for (const row of csvRows){
    const dept = String(row['부서명'] ?? '').trim();
    const company = String(row['보험사'] ?? '').trim();
    const code = cleanBranchCode(row['지점코드']);
    const branchName = cleanBranchName(row['지점명']);
    if (!dept || !company) continue;
    if (!code) continue;

    if (!exact.has(dept)) exact.set(dept, new Map());
    setOrFlagAmbiguous(exact.get(dept), company, {code, name: branchName});

    const normKey = normalizeOrgName(dept);
    if (!normGroups.has(normKey)) normGroups.set(normKey, new Map());
    const deptGroup = normGroups.get(normKey);
    if (!deptGroup.has(dept)) deptGroup.set(dept, new Map());
    setOrFlagAmbiguous(deptGroup.get(dept), company, {code, name: branchName});
  }
  return { exact, normGroups };
}

function climbForCompany(pathNodes, csvKey, orgLookup){
  // pathNodes: 최상위 -> 최하위 순서 배열. 최하위부터 거슬러 올라가며 탐색.
  const climbOrder = [...pathNodes].reverse();
  let ambiguousAt = null;
  for (let i=0;i<climbOrder.length;i++){
    const node = climbOrder[i];

    // 1) 정확히 같은 이름으로 먼저 시도
    const exactMap = orgLookup.exact.get(node);
    if (exactMap && exactMap.has(csvKey)){
      const entry = exactMap.get(csvKey);
      if (entry.ambiguous){
        if (!ambiguousAt) ambiguousAt = { org: node, codes: entry.codes };
        // 이 레벨은 신뢰할 수 없으므로 계속 상위로 탐색
      } else {
        return { found:true, atOrg: node, atLevel: i, matchType:'exact', ...entry };
      }
    }

    // 2) 끝단어(팀/본부/지점 등) 차이를 무시하고 재시도
    const normKey = normalizeOrgName(node);
    const group = orgLookup.normGroups.get(normKey);
    if (group){
      const candidates = [...group.entries()].filter(([, m]) => m.has(csvKey) && !m.get(csvKey).ambiguous);
      if (candidates.length === 1){
        const [matchedDept, m] = candidates[0];
        return { found:true, atOrg: matchedDept, matchedFrom: node, atLevel: i, matchType:'normalized', ...m.get(csvKey) };
      }
      // 후보가 2개 이상(서로 다른 조직인데 이름이 겹침)이면 애매하므로 신뢰하지 않고 계속 상위로
    }
  }
  if (ambiguousAt) return { found:false, ambiguous:true, ambiguousAt };
  return { found:false };
}

function processEmployees(faRows, orgLookup){
  const results = [];
  for (const row of faRows){
    const empNo = String(row['사원번호'] ?? '').trim();
    const empName = String(row['사원명'] ?? '').trim();
    const orgPathRaw = String(row['사원소속'] ?? '').trim();
    const ssn = String(row['주민번호'] ?? '').trim();
    if (!empName && !empNo) continue;

    const pathNodes = orgPathRaw.split('>').map(s=>s.trim()).filter(Boolean);
    const registeredCo = String(row['등록사'] ?? '').trim();

    const companyResults = TARGET_COMPANIES.map(cfg=>{
      const alreadyRegistered = registeredCo === cfg.key;
      const personalRaw = row[cfg.faCol];
      const personalCode = formatPersonalCode(personalRaw);
      const personalUsable = isUsableCode(personalCode);
      const climb = (!alreadyRegistered && pathNodes.length) ? climbForCompany(pathNodes, cfg.csvKey, orgLookup) : {found:false};
      const eligible = !alreadyRegistered && personalUsable && climb.found;
      let excludeReason = '';
      if (alreadyRegistered) excludeReason = '이미 등록사(소속이동 불필요)';
      else if (!personalUsable && !climb.found) excludeReason = '사용인코드·지점코드 모두 없음';
      else if (!personalUsable) excludeReason = hasHangul(personalCode) ? `사용인코드 특이사항(${personalCode})` : '사용인코드 없음';
      else if (!climb.found && climb.ambiguous) excludeReason = `지점코드 중복 등록(${climb.ambiguousAt.org}, 데이터 확인 필요)`;
      else if (!climb.found) excludeReason = '상위조직까지 지점코드 없음';
      return {
        companyKey: cfg.key,
        cfg,
        personalCode, personalUsable,
        climb,
        alreadyRegistered,
        eligible,
        included: eligible, // 사용자가 체크박스로 조정 가능한 값 (초기값 = eligible)
        excludeReason,
      };
    });

    const manualFlags = MANUAL_COMPANIES.map(cfg=>{
      const raw = formatPersonalCode(row[cfg.faCol]);
      const has = isUsableCode(raw);
      return { companyKey: cfg.key, cfg, code: raw, has };
    }).filter(m=>m.has);

    results.push({
      id: empNo || empName + Math.random().toString(36).slice(2,7),
      empNo, empName, ssn, orgPathRaw, pathNodes,
      phone: '',
      companyResults,
      manualFlags,
      open: false,
    });
  }
  return results;
}

async function runAnalysis(){
  if (!state.faFile || !state.csvFile){
    setState({errorMsg:'이동대상자 명단과 지점코드 CSV 파일을 모두 올려주세요.'});
    return;
  }
  setState({step:2, errorMsg:''});
  try{
    const [faRows, csvRows] = await Promise.all([
      parseXlsxToRows(state.faFile),
      parseCsvToRows(state.csvFile),
    ]);

    const missingCols = REQUIRED_FA_COLS.filter(c => !(c in (faRows[0]||{})));
    if (faRows.length === 0){
      setState({step:1, errorMsg:'이동대상자 명단에서 데이터를 찾지 못했습니다. 파일을 확인해주세요.'});
      return;
    }
    if (missingCols.length){
      setState({step:1, errorMsg:`이동대상자 명단에 필요한 컬럼이 없습니다: ${missingCols.join(', ')}`});
      return;
    }
    if (!('부서명' in (csvRows[0]||{})) || !('보험사' in (csvRows[0]||{})) || !('지점코드' in (csvRows[0]||{}))){
      setState({step:1, errorMsg:'지점코드 CSV에 부서명/보험사/지점코드 컬럼이 필요합니다.'});
      return;
    }

    const orgLookup = buildOrgLookup(csvRows);
    const employees = processEmployees(faRows, orgLookup);

    // 분석 중이라는 인지적 신호를 주기 위한 최소 로딩 시간 (실제 처리는 훨씬 빠름)
    await new Promise(r => setTimeout(r, 2000));

    setState({step:3, employees});
  }catch(e){
    console.error(e);
    setState({step:1, errorMsg:'파일을 읽는 중 오류가 발생했습니다: ' + (e.message || e)});
  }
}

function orgPathHtml(pathNodes, foundOrg){
  const climbOrder = [...pathNodes].reverse();
  const foundIdx = foundOrg ? climbOrder.indexOf(foundOrg) : -1;
  return climbOrder.map((node,i)=>{
    let cls = '';
    if (foundIdx === -1) cls = 'miss';       // 끝까지 탐색했지만 못 찾음
    else if (i < foundIdx) cls = 'miss';     // 탐색했지만 코드 없었음
    else if (i === foundIdx) cls = 'hit';    // 여기서 찾음
    // i > foundIdx: 탐색 전 중단(상위는 확인 안 함) -> 기본 스타일
    return `<span class="node ${cls}">${escapeHtml(node)}</span>`;
  }).join('<span class="arrow">←</span>');
}

const ROWS_PER_PAGE = 10;

function loadImageDims(dataUrl){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>resolve({w:img.naturalWidth, h:img.naturalHeight});
    img.onerror = reject;
    img.src = dataUrl;
  });
}

async function addImagePageFitted(pdf, dataUrl, firstPageFlag){
  const pw = pdf.internal.pageSize.getWidth();
  const ph = pdf.internal.pageSize.getHeight();
  const margin = 30;
  const maxW = pw - margin*2;
  const maxH = ph - margin*2;
  const dims = await loadImageDims(dataUrl);
  const scale = Math.min(maxW/dims.w, maxH/dims.h);
  const drawW = dims.w*scale;
  const drawH = dims.h*scale;
  const x = (pw-drawW)/2;
  const y = (ph-drawH)/2;
  if (!firstPageFlag.v) pdf.addPage();
  const fmt = dataUrl.startsWith('data:image/png') ? 'PNG' : 'JPEG';
  pdf.addImage(dataUrl, fmt, x, y, drawW, drawH);
  firstPageFlag.v = false;
}

async function generateManualOnlyPdf(){
  const btn = document.getElementById('btn-manual-pdf');
  if (btn){ btn.disabled = true; btn.textContent = '생성 중...'; }
  try{
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'pt', format:'a4', orientation:'landscape'});
    const firstPageFlag = { v: true };
    for (const cfg of MANUAL_COMPANIES){
      if (!cfg.defaultImg) continue; // 라이나손보처럼 별도 매뉴얼 이미지가 없는 경우 건너뜀
      await addImagePageFitted(pdf, cfg.defaultImg, firstPageFlag);
    }
    const blob = pdf.output('blob');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `수동처리매뉴얼_하나AIG_MG_${todayStr()}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
  }catch(e){
    console.error(e);
    alert('매뉴얼 PDF 생성 중 오류가 발생했습니다: ' + (e.message||e));
  } finally {
    if (btn){ btn.disabled = false; btn.textContent = '매뉴얼 PDF 다운로드 (하나·AIG·MG)'; }
  }
}

async function generatePdf(){
  setState({pdfBusy:true});
  try{
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'pt', format:'a4', orientation:'landscape'});
    let firstPage = true;

    for (const cfg of TARGET_COMPANIES){
      const rows = state.employees
        .map(e => ({ e, cr: e.companyResults.find(c=>c.companyKey===cfg.key) }))
        .filter(x => x.cr && x.cr.included && x.cr.eligible)
        .map(x => ({ empName:x.e.empName, ssn:x.e.ssn, phone:x.e.phone, personalCode:x.cr.personalCode, climb:x.cr.climb }));

      if (rows.length === 0) continue;

      const chunks = [];
      for (let i=0;i<rows.length;i+=ROWS_PER_PAGE) chunks.push(rows.slice(i,i+ROWS_PER_PAGE));

      for (let p=0;p<chunks.length;p++){
        const html = buildCompanyPageHtml(cfg, chunks[p], p+1, chunks.length);
        const canvas = await renderNodeToCanvas(html);
        const imgData = canvas.toDataURL('image/jpeg', 0.92);
        const pw = pdf.internal.pageSize.getWidth();
        const ph = pdf.internal.pageSize.getHeight();
        if (!firstPage) pdf.addPage();
        pdf.addImage(imgData, 'JPEG', 0, 0, pw, ph);
        firstPage = false;
      }
    }

    // 하나손보/AIG손보/MG손보/라이나손보 매뉴얼은 검토 화면의 별도 버튼으로 다운로드하므로 최종 PDF에는 포함하지 않음

    const blob = pdf.output('blob');
    const url = URL.createObjectURL(blob);
    setState({pdfBusy:false, pdfDone:true, pdfUrl:url, step:4});
  }catch(e){
    console.error(e);
    setState({pdfBusy:false, errorMsg:'PDF 생성 중 오류: ' + (e.message||e)});
  }
}

function renderStepper(){

function summarize(){
  const total = state.employees.length;
  let fullMatch=0, partial=0, manualOnly=0;
  for (const e of state.employees){
    const matchedCount = e.companyResults.filter(c=>c.eligible).length;
    if (matchedCount === TARGET_COMPANIES.length) fullMatch++;
    else if (matchedCount > 0) partial++;
    if (e.manualFlags.length>0) manualOnly++;
  }
  const missingPhones = state.employees.filter(e=>!e.phone || !e.phone.trim()).length;
  return {total, fullMatch, partial, manualOnly, missingPhones};
}

function renderEmpCard(emp){
  const rows = emp.companyResults.map(cr=>{
    const pathHtml = emp.pathNodes.length ? orgPathHtml(emp.pathNodes, cr.climb.matchedFrom || cr.climb.atOrg) : '<span style="color:#B7BECC">소속 경로 없음</span>';
    const matchNote = cr.climb.found && cr.climb.matchType === 'normalized'
      ? `<div style="font-size:10.5px;color:var(--amber);margin-top:2px;">CSV 등록명: ${escapeHtml(cr.climb.atOrg)} (표기 차이 자동 보정됨)</div>`
      : '';
    let statusCell;
    if (cr.eligible){
      statusCell = `<label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
        <input type="checkbox" class="chk" data-emp="${emp.id}" data-co="${cr.companyKey}" ${cr.included?'checked':''} onchange="toggleInclude('${emp.id}','${cr.companyKey}')" />
        <span class="pill ok">포함</span>
      </label>`;
    } else if (cr.alreadyRegistered) {
      statusCell = `<span class="pill off" title="${escapeHtml(cr.excludeReason)}">협회등록사</span>`;
    } else {
      statusCell = `<span class="pill warn" title="${escapeHtml(cr.excludeReason)}">제외</span>`;
    }
    return `
      <tr>
        <td>
          <div class="co-name">${escapeHtml(cr.companyKey)}</div>
          <div class="co-code">사용인코드: ${cr.personalCode ? escapeHtml(cr.personalCode) : '<span style=\"color:#B7BECC\">-</span>'}</div>
        </td>
        <td>
          ${cr.climb.found
            ? `<div class="co-code">${escapeHtml(cr.climb.atOrg)} · ${escapeHtml(cr.climb.code)}</div>${matchNote}`
            : cr.climb.ambiguous
              ? `<span style="color:var(--amber);font-size:11.5px;font-weight:600;">⚠ ${escapeHtml(cr.climb.ambiguousAt.org)}에 코드 중복(${cr.climb.ambiguousAt.codes.map(escapeHtml).join(' / ')}) — CSV 확인 필요</span>`
              : `<span style="color:#B7BECC;font-size:11.5px;">지점코드 없음</span>`}
          <div class="co-path">${pathHtml}</div>
        </td>
        <td style="width:76px;text-align:center;">${statusCell}</td>
      </tr>`;
  }).join('');

  return `

    <div class="emp-head ${emp.open?'open':''}" onclick="toggleEmpOpen('${emp.id}')">
      <div class="who">
        <span class="chev">▶</span>

          onclick="event.stopPropagation()" oninput="updatePhone('${emp.id}', this.value)" />

function render(){
  const app = document.getElementById('app');
  let body = '';
  if (state.step===1) body = renderStep1();
  else if (state.step===2) body = renderStep2();
  else if (state.step===3) body = renderStep3();
  else if (state.step===4) body = renderStep4();

  app.innerHTML = renderHeader() + renderStepper() + body + `<div class="footer-credit">사내 업무 자동화 도구 · 원본 파일은 수정되지 않습니다</div>`;

  // 이벤트 바인딩
  const dzFa = document.getElementById('input-fa');
  if (dzFa) dzFa.addEventListener('change', e=>handleFile('fa', e.target.files[0]));
  const dzCsv = document.getElementById('input-csv');
  if (dzCsv) dzCsv.addEventListener('change', e=>handleFile('csv', e.target.files[0]));
  const senderName = document.getElementById('input-sender-name');
  if (senderName) senderName.addEventListener('input', e=>{state.senderName = e.target.value;});
  const senderPhone = document.getElementById('input-sender-phone');
  if (senderPhone) senderPhone.addEventListener('input', e=>{state.senderPhone = e.target.value;});
  const btnAnalyze = document.getElementById('btn-analyze');
  if (btnAnalyze) btnAnalyze.addEventListener('click', runAnalysis);
  const btnGenerate = document.getElementById('btn-generate');
  if (btnGenerate) btnGenerate.addEventListener('click', generatePdf);
  const btnManualPdf = document.getElementById('btn-manual-pdf');
  if (btnManualPdf) btnManualPdf.addEventListener('click', generateManualOnlyPdf);

  // drag & drop
  ['dz-fa','dz-csv'].forEach(id=>{
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('dragover', e=>{e.preventDefault(); el.classList.add('filled');});
    el.addEventListener('drop', e=>{
      e.preventDefault();
      const f = e.dataTransfer.files[0];
      if (f) handleFile(id==='dz-fa'?'fa':'csv', f);
    });
  });
}

render();
